title: Paperwork
description: "Help for Paperwork: design document templates once, publish them, and create documents in the browser, from the command line, in your own .NET code, or with your AI."
theme: just-the-docs
color_scheme: paperwork-dark

url: https://paperwork.help

twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

aux_links:
  "Design ↗": https://paperwork.design
  "Code ↗": https://github.com/richard-scryber/scryber.core
  "Corporate ↗": https://www.paperwork-collective.com
aux_links_new_tab: true

heading_anchors: false

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

defaults:
  - scope: { path: "" }
    values:
      image: { path: /assets/images/share-home.png, width: 1200, height: 630 }
  - scope: { path: "overview.md" }
    values:
      image: { path: /assets/images/share-overview.png, width: 1200, height: 630 }
  - scope: { path: "paperwork.design" }
    values:
      image: { path: /assets/images/share-design.png, width: 1200, height: 630 }
  - scope: { path: "paperwork.view" }
    values:
      image: { path: /assets/images/share-view.png, width: 1200, height: 630 }
  - scope: { path: "paperwork.core" }
    values:
      image: { path: /assets/images/share-core.png, width: 1200, height: 630 }
  - scope: { path: "paperwork.cli" }
    values:
      image: { path: /assets/images/share-cli.png, width: 1200, height: 630 }
  - scope: { path: "paperwork.skill" }
    values:
      image: { path: /assets/images/share-skill.png, width: 1200, height: 630 }

ga_tracking: G-C7R7SHJGSR
ga_tracking_anonymize_ip: true # Use GDPR compliant Google Analytics settings (true/nil by default)

    

